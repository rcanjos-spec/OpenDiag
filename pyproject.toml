[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "opendiag"
version = "0.1.0"
description = "Open Automotive Diagnostic Platform"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Rogerio Anjos" }
]

dependencies = [
    "python-can>=4.6.1",
    "pyserial>=3.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
